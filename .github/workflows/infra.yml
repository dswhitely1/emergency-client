name: infra

on:
  pull_request:
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [master]
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - ".github/workflows/infra.yml"

permissions:
  id-token: write
  contents: read
  pull-requests: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_turnstile_site_key: ${{ vars.TF_VAR_turnstile_site_key }}
  TF_VAR_github_access_token: ${{ secrets.TF_VAR_github_access_token }}
  TF_VAR_turnstile_secret_key: ${{ secrets.TF_VAR_turnstile_secret_key }}

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform fmt -check -recursive

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - run: terraform validate -no-color

      - id: plan
        run: |
          set -o pipefail
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt

      - name: Comment plan on PR
        if: always() && steps.plan.outcome != 'skipped'
        uses: actions/github-script@v8
        env:
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- infra-plan -->';
            let plan = fs.existsSync('infra/plan.txt') ? fs.readFileSync('infra/plan.txt', 'utf8') : '(no plan output)';
            if (plan.length > 60000) plan = '…(truncated)\n' + plan.slice(-60000);
            const body = `${marker}\n### Terraform plan: \`${process.env.PLAN_OUTCOME}\`\n\n<details><summary>Show plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n</details>`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      # Plan the merged state, record it on the run summary, then apply exactly that plan.
      - run: terraform plan -input=false -no-color -out=tfplan

      - run: |
          {
            echo '### Applied plan'
            echo '```'
            terraform show -no-color tfplan
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - run: terraform apply -input=false -no-color tfplan
